<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Editor — actorsbookmag</title>
<style>
:root{--fg:#0d0d0d;--muted:#9b9b9b;--line:#e6e6e6;--red:#ff0000;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;line-height:1.7}
header{display:flex;align-items:baseline;gap:16px;padding:20px 28px;border-bottom:1px solid var(--fg)}
.brand{font-weight:800}.brand .dot{color:var(--red)}
header .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
header .right{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px}
.dotok{color:#1a9e4b;font-weight:700}.dotng{color:var(--red);font-weight:700}
main{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 62px)}
aside{border-right:1px solid var(--line);padding:16px;overflow:auto}
aside h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 8px 12px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 10px;border-radius:8px;
 cursor:pointer;font:inherit;color:inherit;border-bottom:1px solid var(--line)}
.item:hover{background:#f6f6f6}
.item.sel{background:#111;color:#fff}
.item small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em}
.item.sel small{color:#bbb}
.st{font-weight:700}.st-pub{color:#1a9e4b}.st-draft{color:#c98a00}
.item.sel .st-pub{color:#7ee2a3}.item.sel .st-draft{color:#f0c86b}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px}
.newbtn{width:100%;margin-bottom:12px;padding:10px;border:1px dashed #bbb;background:none;border-radius:8px;cursor:pointer;font:inherit}
section.edit{padding:30px 40px;max-width:760px}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;padding:12px 14px;border:1px solid #ccc;border-radius:8px;
 font:inherit;background:#fff;color:var(--fg)}
textarea{min-height:220px;resize:vertical;line-height:1.9}
input[type=text].big{font-size:22px;font-weight:800;letter-spacing:-.01em}
.row2{display:flex;gap:16px}.row2>div{flex:1}
.bgprev{margin-top:10px;width:180px;aspect-ratio:4/5;object-fit:cover;background:#f0f0f0;border:1px solid var(--line);display:block}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:16px 40px;display:flex;gap:16px;align-items:center;margin:30px -40px 0}
button.save{background:#111;color:#fff;border:0;border-radius:8px;padding:12px 26px;font:inherit;font-weight:700;cursor:pointer}
button.save:disabled{opacity:.4;cursor:default}
.pubbtn{border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.pub{background:#1a9e4b;color:#fff;border:0}
.unpub{background:#fff;color:#c0392b;border:1px solid #e3b7b1}
.pubbtn:disabled{opacity:.4;cursor:default}
.sns{margin-top:26px;padding:20px;border:1px solid var(--line);border-radius:12px;background:#fafafa}
.snshd{font-weight:800;font-size:15px;margin-bottom:4px}
.snshd span{font-weight:400;font-size:12px;color:#999}
.snsbtns{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.snsbtn{border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;color:#fff}
.snsbtn.x{background:#111}
.snsbtn.ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.snsnote{font-size:11px;color:#999}
.assets{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.ahd{font-size:13px;font-weight:700;color:#333;margin-bottom:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a{position:relative;display:block}
.thumbs img{width:66px;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#eee}
.thumbs span{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px}
.dlbtn{display:inline-block;background:#111;color:#fff;padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px}
.anote{margin-top:16px;font-size:12px;color:#999}
a.view{font-size:13px;color:var(--muted)}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:#1a9e4b}.status.err{color:var(--red)}
.tokenbox{padding:40px;max-width:560px}
.tokenbox input{margin-top:10px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.empty{padding:60px 40px;color:var(--muted)}
.slidelist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.slot{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px}
.sthumb{width:64px;aspect-ratio:4/5;flex:none;border-radius:6px;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center}
.sthumb img{width:100%;height:100%;object-fit:cover}
.sph{color:#888;font-size:11px}
.sinfo{flex:1;min-width:0}
.snum{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stext{font-size:13px;color:#333;margin:2px 0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stextedit{width:100%;border:1px solid #ddd;border-radius:6px;padding:8px 10px;font:inherit;font-size:13px;line-height:1.55;resize:vertical;margin:3px 0 8px;background:#fff;color:var(--fg);min-height:44px}
.thumbs a{cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:1000}
.lightbox .lbinner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:92vw;max-height:92vh}
.lightbox img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:6px;box-shadow:0 10px 60px rgba(0,0,0,.6)}
.lightbox .lbbar{display:flex;gap:12px;align-items:center}
.lightbox .lbdl{background:#fff;color:#111;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;text-decoration:none}
.lightbox .lbclose{background:none;border:1px solid #666;color:#fff;padding:9px 16px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.lightbox .lbnav{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.sact{display:flex;gap:8px;align-items:center}
.sbtn{display:inline-block;background:#111;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.sclear{background:none;border:1px solid #ddd;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:#c0392b}
</style>
</head>
<body>
<header>
  <span class="brand">ACTORSBOOK<span class="dot">.</span></span>
  <span class="tag">Editor</span>
  <div class="right">
    <span id="conn"></span>
    <a class="view" href="/news/" target="_blank">サイトを見る ↗</a>
    <button id="logout" class="view" style="border:0;background:none;cursor:pointer">ログアウト</button>
  </div>
</header>

<div id="app"></div>

<script>
const app=document.getElementById("app");
let NEWS=[], sel=null, pendingFile=null, pendingURL=null, pendingSlides={};

// ---- Canvasでニュースサムネを"その場で"合成（画像+黒スモーク+見出し）----
function _coverDraw(ctx,im,W,H){
  const ir=im.width/im.height, dr=W/H; let w,h,x,y;
  if(ir>dr){h=H;w=H*ir;x=(W-w)/2;y=0;} else {w=W;h=W/ir;x=0;y=(H-h)/2;}
  ctx.drawImage(im,x,y,w,h);
}
function _wrapCanvas(ctx,text,maxW){
  const lines=[]; let cur="";
  for(const ch of (text||"")){ const t=cur+ch; if(ctx.measureText(t).width>maxW && cur){lines.push(cur);cur=ch;} else cur=t; }
  if(cur)lines.push(cur); return lines.slice(0,5);
}
function currentThumbSrc(){
  if(pendingURL) return pendingURL;
  const url=(document.getElementById("f_url")||{}).value||"";
  if(url) return url;
  return (NEWS[sel]||{}).background||"";
}
// カテゴリ由来の巨大ゴースト・ワードマーク（黒背景時の"透かし"。Pillow版(make_assets.py)と一致）
const GHOST={"映画":["CINE","PHILE"],"本・書店":["BIBLIO","PHILE"],"ストリート":["STREET"],"ファッション":["MODE"]};
function _pillCanvas(ctx,x,y,text,fontPx){
  ctx.textBaseline="top";
  ctx.font="700 "+fontPx+"px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
  const padx=20,pady=10, tw=ctx.measureText(text).width, w=tw+padx*2, h=fontPx+pady*2;
  ctx.fillStyle="#ff3c3c";
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.fill();} else {ctx.fillRect(x,y,w,h);}
  ctx.fillStyle="#fff"; ctx.fillText(text,x+padx,y+pady);
  return x+w;
}
function _ghostCanvas(ctx,cat){
  const words=(GHOST[cat]||["CINE","PHILE"]).slice(0,2);
  ctx.fillStyle="#1a1a1a"; ctx.textBaseline="top";
  ctx.font="900 189px 'Helvetica Neue',Arial,sans-serif";
  let y=230; words.forEach(w=>{ctx.fillText(w,65,y); y+=162;});
}
function drawThumb(){
  const c=document.getElementById("bgprev"); if(!c||!c.getContext) return;
  const ctx=c.getContext("2d"); const W=1080,H=1350;
  const head=(document.getElementById("f_head")||{}).value||"";
  const dek=(document.getElementById("f_dek")||{}).value||"";
  const cat=(document.getElementById("f_cat")||{}).value||"映画";
  const overlay=(hasPhoto)=>{
    if(hasPhoto){
      ctx.fillStyle="rgba(0,0,0,0.30)"; ctx.fillRect(0,0,W,H);
      const g=ctx.createLinearGradient(0,H*0.42,0,H); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,0.92)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    } else { _ghostCanvas(ctx,cat); }
    ctx.textBaseline="top";
    ctx.fillStyle="#fff"; ctx.font="900 44px 'Helvetica Neue',Arial,sans-serif"; ctx.fillText("ACTORSBOOK",71,56);
    _pillCanvas(ctx,71,120,cat,25);
    ctx.fillStyle="#fff"; ctx.font="800 80px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    const lines=_wrapCanvas(ctx,head,W-142); const lh=95;
    let y=H-Math.round(H*0.085)-lh*lines.length-(dek?54:0);
    lines.forEach(l=>{ctx.fillText(l,71,y);y+=lh;});
    if(dek){ctx.fillStyle="#c6c6c6"; ctx.font="400 31px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif"; ctx.fillText(dek.slice(0,30),71,y+12);}
    ctx.fillStyle="#ff3c3c"; ctx.fillRect(0,H-14,W,14);
  };
  ctx.clearRect(0,0,W,H); ctx.fillStyle="#0a0a0a"; ctx.fillRect(0,0,W,H);
  const src=currentThumbSrc();
  if(src){
    const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>{ctx.fillStyle="#0a0a0a";ctx.fillRect(0,0,W,H);_coverDraw(ctx,im,W,H);overlay(true);};
    im.onerror=()=>overlay(false); im.src=src;
  } else overlay(false);
}

// ---- utils ----
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pw=()=>sessionStorage.getItem("edit_pw")||localStorage.getItem("edit_pw")||"";
function u8ToB64(u8){let s="";const c=0x8000;for(let i=0;i<u8.length;i+=c)s+=String.fromCharCode.apply(null,u8.subarray(i,i+c));return btoa(s);}
function fmtDate(iso){try{const d=new Date(iso);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}catch(e){return "";}}

const SITE="https://actorsbookmag.vercel.app";
// X用テキストの自動生成（見出し+リード+リンク+ハッシュタグ3つ）
function genX(a){
  const url=SITE+"/news/article.html?id="+a.id;
  const tags=(a.hashtags||[]).slice(0,3).join(" ");
  let t=(a.headline||"");
  if(a.dek) t+="\n\n"+a.dek;
  t+="\n\n▶ "+url;
  if(tags) t+="\n"+tags;
  return t;
}
// Instagram用テキスト（キャプション長め・ハッシュタグ多め。リンクはプロフィール誘導）
function genIG(a){
  const base=(a.hashtags||[]).map(t=>t).join(" ");
  const extra="#映画 #インディペンデント映画 #ミニシアター #cinema #film";
  return [a.headline||"", a.dek||"", "▶ 記事はプロフィールのリンクから", (base+" "+extra).trim()].filter(Boolean).join("\n\n");
}

function renderConn(){
  document.getElementById("conn").innerHTML = pw()
    ? '<span class="dotok">● ログイン中</span>' : '<span class="dotng">● 未ログイン</span>';
}

// ---- パスワードゲート ----
function passwordGate(){
  renderConn();
  app.innerHTML=`<div class="tokenbox">
    <h2>編集するにはパスワードを入力してください</h2>
    <p class="hint">Vercelに設定した <b>EDIT_PASSWORD</b> を入力します。パスワードはこのブラウザ内だけに保存されます。</p>
    <label>パスワード</label>
    <input id="pw" type="password" placeholder="••••••••">
    <p style="margin-top:16px"><button class="save" id="savepw">ログイン</button>
      <span class="status" id="pwstatus" style="margin-left:12px"></span></p>
  </div>`;
  const go=()=>{const v=document.getElementById("pw").value;if(!v){return;}localStorage.setItem("edit_pw",v);boot();};
  document.getElementById("savepw").onclick=go;
  document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}

// ---- 一覧 + 編集 ----
function shell(){
  app.innerHTML=`<main>
    <aside>
      <h2>記事</h2>
      <button class="newbtn" id="new">＋ 新規記事</button>
      <div id="list"></div>
    </aside>
    <section class="edit" id="editor"><div class="empty">左の一覧から記事を選んでください。</div></section>
  </main>`;
  document.getElementById("new").onclick=newArticle;
  renderList();
}
function renderList(){
  const el=document.getElementById("list");
  el.innerHTML=NEWS.map((a,i)=>{
    const isPub=a.status!=='draft';
    const badge=isPub?'<span class="st st-pub">● 公開</span>':'<span class="st st-draft">○ 下書き</span>';
    return `<button class="item ${sel===i?'sel':''}" data-i="${i}">
     ${esc(a.headline||'(無題)')}<small>${badge}　${esc(a.category||'映画')}</small></button>`;}).join("");
  [...el.querySelectorAll(".item")].forEach(b=>b.onclick=()=>{sel=+b.dataset.i;pendingFile=null;pendingSlides={};renderList();renderEditor();});
}
// 本文段落ごとのスライド画像UI。pendingSlides[i]=新規アップロード, NEWS[sel].slide_images[i]=保存済みパス
function renderSlides(){
  const wrap=document.getElementById("slideList"); if(!wrap) return;
  const body=(document.getElementById("f_body")||{}).value||"";
  const paras=body.split(/\n\n+/).map(s=>s.trim()).filter(Boolean);
  const cur=(NEWS[sel]&&NEWS[sel].slide_images)||[];
  if(!paras.length){ wrap.innerHTML='<p class="anote">本文を入力すると、段落ごとのスライドがここに並びます。</p>'; return; }
  const texts=(NEWS[sel]&&NEWS[sel].slide_texts)||[];
  wrap.innerHTML=paras.map((p,i)=>{
    const has=pendingSlides[i]?pendingSlides[i].url:(cur[i]||"");
    const ov=texts[i]||"";
    const ph=`本文から自動：${p.slice(0,36)}${p.length>36?'…':''}`;
    return `<div class="slot">
      <div class="sthumb">${has?`<img src="${esc(has)}" alt="">`:'<span class="sph">白地</span>'}</div>
      <div class="sinfo">
        <div class="snum">スライド ${i+2}</div>
        <textarea class="stextedit" data-i="${i}" rows="2" placeholder="${esc(ph)}">${esc(ov)}</textarea>
        <div class="sact">
          <label class="sbtn">画像を選ぶ<input type="file" accept="image/*" class="sfile" data-i="${i}" hidden></label>
          ${has?`<button type="button" class="sclear" data-i="${i}">クリア</button>`:''}
        </div>
      </div>
    </div>`;}).join("");
  wrap.querySelectorAll(".stextedit").forEach(t=>t.oninput=()=>{
    const i=+t.dataset.i; const arr=(NEWS[sel].slide_texts=NEWS[sel].slide_texts||[]);
    while(arr.length<=i) arr.push(""); arr[i]=t.value;
  });
  wrap.querySelectorAll(".sfile").forEach(inp=>inp.onchange=()=>{
    const i=+inp.dataset.i, f=inp.files[0]; if(!f) return;
    if(pendingSlides[i]&&pendingSlides[i].url) URL.revokeObjectURL(pendingSlides[i].url);
    pendingSlides[i]={file:f,url:URL.createObjectURL(f)}; renderSlides();
  });
  wrap.querySelectorAll(".sclear").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(pendingSlides[i]){ if(pendingSlides[i].url)URL.revokeObjectURL(pendingSlides[i].url); delete pendingSlides[i]; }
    if(NEWS[sel].slide_images && NEWS[sel].slide_images[i]) NEWS[sel].slide_images[i]="";
    renderSlides();
  });
}

// カルーセル画像のライトボックス（クリックで拡大プレビュー＋前後送り＋ダウンロード）
let lbList=[], lbIdx=0;
function showLightbox(){
  let lb=document.getElementById("lightbox");
  if(!lb){ lb=document.createElement("div"); lb.id="lightbox"; lb.className="lightbox";
    document.body.appendChild(lb);
    lb.addEventListener("click",e=>{ if(e.target===lb) lb.style.display="none"; }); }
  const u=lbList[lbIdx]||"", many=lbList.length>1;
  lb.innerHTML=`
    ${many?'<button class="lbnav" data-d="-1">‹</button>':''}
    <div class="lbinner">
      <img src="${esc(u)}" alt="">
      <div class="lbbar">
        <span style="color:#aaa;font-size:12px">${lbIdx+1} / ${lbList.length}</span>
        <a class="lbdl" href="${esc(u)}" download>⬇ ダウンロード</a>
        <button class="lbclose">閉じる ✕</button>
      </div>
    </div>
    ${many?'<button class="lbnav" data-d="1">›</button>':''}`;
  lb.style.display="flex";
  lb.querySelector(".lbclose").onclick=()=>lb.style.display="none";
  lb.querySelectorAll(".lbnav").forEach(b=>b.onclick=()=>{ lbIdx=(lbIdx+ +b.dataset.d + lbList.length)%lbList.length; showLightbox(); });
}
document.addEventListener("keydown",e=>{
  const lb=document.getElementById("lightbox"); if(!lb||lb.style.display!=="flex") return;
  if(e.key==="Escape") lb.style.display="none";
  else if(e.key==="ArrowLeft" && lbList.length>1){ lbIdx=(lbIdx-1+lbList.length)%lbList.length; showLightbox(); }
  else if(e.key==="ArrowRight" && lbList.length>1){ lbIdx=(lbIdx+1)%lbList.length; showLightbox(); }
});

function renderEditor(){
  if(sel==null)return;
  const a=NEWS[sel];
  const isPub=a.status!=='draft';
  document.getElementById("editor").innerHTML=`
    <label>見出し（タイトル）</label>
    <input id="f_head" class="big" type="text" value="${esc(a.headline||'')}">
    <div class="row2">
      <div><label>カテゴリ</label>
        <select id="f_cat">${["映画","本・書店","ストリート","ファッション"].map(c=>`<option ${a.category===c?'selected':''}>${c}</option>`).join("")}</select></div>
      <div><label>リード（サブ見出し）</label>
        <input id="f_dek" type="text" value="${esc(a.dek||'')}"></div>
    </div>
    <label>本文</label>
    <textarea id="f_body">${esc(a.body||'')}</textarea>
    <label>Xの引用（ツイートURLを改行区切りで貼る）<span style="text-transform:none;letter-spacing:0;color:#999"> — 記事末に本物のツイートが埋め込まれます</span></label>
    <textarea id="f_embeds" style="min-height:64px" placeholder="https://x.com/.../status/...">${esc((a.embeds||[]).join("\n"))}</textarea>
    <label>サムネイル画像 <span style="text-transform:none;letter-spacing:0;color:#999">— 登録すると右にニュースサムネが即生成されます</span></label>
    <div style="display:flex;gap:20px;align-items:flex-start">
      <canvas class="bgprev" id="bgprev" width="1080" height="1350"></canvas>
      <div style="flex:1">
        <label>画像をアップロード</label><input id="f_file" type="file" accept="image/*">
        <label style="margin-top:14px">または画像URL</label>
        <input id="f_url" type="text" value="${esc((a.background||'').startsWith('http')?a.background:'')}" placeholder="https://...">
        <p class="anote" style="margin-top:12px">見出しを変えると合成も即更新。保存でこのサムネが記事に使われます。</p>
      </div>
    </div>

    <label>カルーセルのスライド <span style="text-transform:none;letter-spacing:0;color:#999">— 各スライドに写真＋テキスト。テキストは空欄なら本文から自動／書けば上書き。公開時に合成</span></label>
    <div id="slideList" class="slidelist"></div>

    <div class="sns">
      <div class="snshd">SNS投稿テキスト<span>（自動生成・そのまま手直しOK）</span></div>
      <label>X（旧Twitter）</label>
      <textarea id="f_xtext" style="min-height:100px">${esc(a.x_text!=null?a.x_text:genX(a))}</textarea>
      <label>Instagram <span style="text-transform:none;letter-spacing:0;color:#999">— サムネイル画像と一緒に投稿されます</span></label>
      <textarea id="f_igtext" style="min-height:120px">${esc(a.ig_text!=null?a.ig_text:genIG(a))}</textarea>
      <div class="snsbtns">
        <button class="snsbtn x" id="postx">Xに投稿</button>
        <button class="snsbtn ig" id="postig">Instagramに投稿</button>
        <span class="snsnote">Xは投稿画面が開きます</span>
      </div>
      ${a.assets ? `
      <div class="assets">
        <div class="ahd">📸 Instagramカルーセル（${a.assets.carousel.length}枚）— 画像を保存して投稿</div>
        <div class="thumbs">${a.assets.carousel.map((u,i)=>`<a href="${esc(u)}" class="thumbimg" data-idx="${i}" title="${i+1}枚目（クリックで拡大）"><img src="${esc(u)}" alt=""><span>${i+1}</span></a>`).join("")}</div>
        <div class="ahd" style="margin-top:14px">🎬 TikTok / Reels 動画（縦型）</div>
        <a class="dlbtn" href="${esc(a.assets.video)}" download target="_blank">▽ 動画をダウンロード</a>
      </div>` : `<div class="anote">※ カルーセル画像・動画は「公開」後に自動生成され、ここに並びます</div>`}
    </div>

    <div class="bar">
      <button class="save" id="save">保存</button>
      ${isPub
        ? '<button class="pubbtn unpub" id="pubtoggle">非公開にする</button>'
        : '<button class="pubbtn pub" id="pubtoggle">公開する</button>'}
      <a class="view" href="/news/article.html?id=${encodeURIComponent(a.id)}" target="_blank">プレビュー ↗</a>
      <span class="status" id="status"></span>
    </div>`;
  const fileEl=document.getElementById("f_file");
  fileEl.onchange=()=>{pendingFile=fileEl.files[0]||null;
    if(pendingURL){URL.revokeObjectURL(pendingURL);pendingURL=null;}
    if(pendingFile){pendingURL=URL.createObjectURL(pendingFile);}
    drawThumb();};
  const uh=document.getElementById("f_url"); if(uh) uh.oninput=()=>drawThumb();
  const hh=document.getElementById("f_head"); if(hh) hh.oninput=()=>drawThumb();
  const dh=document.getElementById("f_dek"); if(dh) dh.oninput=()=>drawThumb();
  const ch=document.getElementById("f_cat"); if(ch) ch.onchange=()=>drawThumb();
  drawThumb();  // 初期表示
  const bh=document.getElementById("f_body"); if(bh) bh.oninput=()=>renderSlides();
  renderSlides();  // スライド画像一覧の初期表示
  document.getElementById("save").onclick=()=>save();               // 状態は変えず保存
  document.getElementById("pubtoggle").onclick=()=>save(isPub?"draft":"published"); // 公開/非公開の切替
  document.getElementById("postx").onclick=()=>postSNS("x");
  document.getElementById("postig").onclick=()=>postSNS("instagram");
  // カルーセルのサムネ→クリックで拡大プレビュー
  const carousel=(a.assets&&a.assets.carousel)||[];
  document.querySelectorAll(".thumbimg").forEach(el=>el.onclick=(e)=>{e.preventDefault(); lbList=carousel; lbIdx=+el.dataset.idx; showLightbox();});
}
function newArticle(){
  const id="post-"+Math.random().toString(36).slice(2,10)+"-"+Date.now();
  NEWS.unshift({id,headline:"（新規記事）",dek:"",body:"",category:"映画",hashtags:[],
    source:"actorsbookmag original",source_url:"",thumbnail:"",background:"",status:"draft",published_at:new Date().toISOString()});
  sel=0;pendingFile=null;pendingSlides={};renderList();renderEditor();
}

async function save(statusOverride){
  const setStatus=(m,cls)=>{const e=document.getElementById("status");if(e){e.className="status "+(cls||"");e.textContent=m;}};
  if(!pw()){passwordGate();return;}
  const btn=document.getElementById("save"); if(btn) btn.disabled=true;
  setStatus("保存中…");
  try{
    const a={...NEWS[sel]};
    a.headline=document.getElementById("f_head").value.trim();
    a.dek=document.getElementById("f_dek").value.trim();
    a.body=document.getElementById("f_body").value;
    a.category=document.getElementById("f_cat").value;
    const _xt=document.getElementById("f_xtext"); if(_xt) a.x_text=_xt.value;
    const _igt=document.getElementById("f_igtext"); if(_igt) a.ig_text=_igt.value;
    const _emb=document.getElementById("f_embeds"); if(_emb) a.embeds=_emb.value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(statusOverride) a.status=statusOverride;   // ボタンで明示切替。無ければ現状維持
    const url=document.getElementById("f_url").value.trim();

    let image=null;
    if(pendingFile){
      setStatus("画像を読み込み中…");
      const buf=new Uint8Array(await pendingFile.arrayBuffer());
      const ext=(pendingFile.name.split(".").pop()||"jpg");
      image={ext, dataB64:u8ToB64(buf)};
    } else if(url){ a.background=url; }

    // その場合成したニュースサムネ(Canvas)をJPEGで書き出し→thumbnailとして保存
    let thumb=null;
    const cv=document.getElementById("bgprev");
    if(cv&&cv.getContext){ try{ thumb=cv.toDataURL("image/jpeg",0.9).split(",")[1]; }catch(e){} }

    // カルーセルのスライド本文（空欄=本文から自動。テキストはJSONに保存されるだけ）
    const stArr=(NEWS[sel].slide_texts||[]).slice();
    document.querySelectorAll('#slideList .stextedit').forEach(t=>{
      const i=+t.dataset.i; while(stArr.length<=i) stArr.push(""); stArr[i]=t.value.trim();
    });
    a.slide_texts=stArr;
    // カルーセルのスライド画像（新規アップロード分をまとめる／既存の割り当ては維持）
    a.slide_images=(NEWS[sel].slide_images||[]).slice();
    const slidesPayload=[];
    for(const k of Object.keys(pendingSlides)){
      const i=+k, f=pendingSlides[i]&&pendingSlides[i].file; if(!f) continue;
      const b=new Uint8Array(await f.arrayBuffer());
      slidesPayload.push({idx:i, ext:(f.name.split('.').pop()||'jpg'), dataB64:u8ToB64(b)});
    }

    setStatus("保存中…");
    const resp=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:pw(), record:a, image, thumb, slides:slidesPayload})});
    let data={}; try{data=await resp.json();}catch(e){}
    if(!resp.ok){
      if(resp.status===401){ setStatus("⚠ パスワードが違います。ログアウトして入れ直してください。","err"); }
      else{ setStatus("⚠ "+(data.error||("失敗 "+resp.status)),"err"); }
      if(btn) btn.disabled=false; return false;
    }
    if(data.background) a.background=data.background;
    if(data.slide_images) a.slide_images=data.slide_images;
    NEWS[sel]=a; pendingFile=null;
    Object.values(pendingSlides).forEach(s=>{if(s&&s.url)URL.revokeObjectURL(s.url);}); pendingSlides={};
    renderList(); renderEditor();  // 再描画でボタンが公開⇄非公開に切替わる
    setStatus(
      statusOverride==="published" ? "✓ 公開しました。1分ほどで反映されます。"
      : statusOverride==="draft"   ? "✓ 非公開にしました。1分ほどで反映されます。"
      : "✓ 保存しました。1分ほどで反映されます。", "ok");
    return true;
  }catch(e){ setStatus("⚠ "+e.message,"err"); if(btn) btn.disabled=false; return false; }
}


// SNS投稿ボタン
function postSNS(target){
  const xt=(document.getElementById("f_xtext")||{}).value||"";
  const igt=(document.getElementById("f_igtext")||{}).value||"";
  if(target==="x"){
    // Xは投稿インテントで即・投稿画面へ（キー不要）。※画像添付はAPI連携後に対応
    window.open("https://x.com/intent/post?text="+encodeURIComponent(xt), "_blank", "noopener");
  }else{
    // InstagramはAPI/アプリが必須。今はキャプションをコピーして手動投稿を案内
    if(navigator.clipboard) navigator.clipboard.writeText(igt);
    alert("Instagramのキャプションをコピーしました。\n\nサムネイル画像を保存 → Instagramアプリで画像を選び、キャプションを貼り付けて投稿してください。\n（画像つきの自動投稿は、Instagram APIキー設定後に有効化します）");
  }
}

// ---- 起動 ----
async function boot(){
  renderConn();
  try{
    const r=await fetch("/data/news.json",{cache:"no-store"});
    NEWS=await r.json();
  }catch(e){ NEWS=[]; }
  shell();
}
document.getElementById("logout").onclick=()=>{localStorage.removeItem("edit_pw");sessionStorage.removeItem("edit_pw");passwordGate();};
if(pw()) boot(); else passwordGate();
</script>
