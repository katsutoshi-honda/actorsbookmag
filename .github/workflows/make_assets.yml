name: Generate SNS assets on publish

# 記事が公開される(=data/news.jsonが更新される)たびに走り、
# 公開済み・未生成の記事のIGカルーセル+縦型動画を生成してコミットする。
on:
  push:
    branches: [main]
    paths:
      - 'data/news.json'
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install Pillow requests beautifulsoup4 lxml feedparser

      - name: Generate SNS assets for published articles
        run: python scripts/make_assets.py --all-published

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social data/news.json
          if git diff --staged --quiet; then
            echo "No new assets to commit"
          else
            git commit -m "chore: generate SNS assets [skip ci]"
            git push
          fi
